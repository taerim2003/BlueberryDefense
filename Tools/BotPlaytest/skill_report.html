<title>스킬 시험장 판독지</title>
<meta name="description" content="블루베리 디펜스 스킬 시험장 — 진화 스킬끼리의 파워 서열과 진화가 실제로 주는 값">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 계측기 판독지 — 정밀함이 정체성이다. 장식 없는 헤어라인, 모노 숫자, 블루베리 보라 하나만 구조에 쓴다. */
:root {
  color-scheme: light;
  --ground: #f6f4fa;
  --surface: #ffffff;
  --surface-2: #efecf7;
  --ink: #191527;
  --ink-2: #514b6b;
  --muted: #8b85a3;
  --hair: #e2ddee;
  --rule: #cec7e0;
  --accent: #6b3fa0;
  --bar: #2f6fb5;
  --bar-soft: rgba(47, 111, 181, .16);
  --good: #0e7a4f;
  --warn: #b8860b;
  --bad: #c2472e;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #131120; --surface: #1c1930; --surface-2: #252142;
    --ink: #f0eef8; --ink-2: #b9b3cd; --muted: #837d9c;
    --hair: #2e2949; --rule: #3d3663;
    --accent: #a184d8;
    --bar: #4d8fd6; --bar-soft: rgba(77, 143, 214, .22);
    --good: #2fa06e; --warn: #b8891f; --bad: #d96a4f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #131120; --surface: #1c1930; --surface-2: #252142;
  --ink: #f0eef8; --ink-2: #b9b3cd; --muted: #837d9c;
  --hair: #2e2949; --rule: #3d3663;
  --accent: #a184d8;
  --bar: #4d8fd6; --bar-soft: rgba(77, 143, 214, .22);
  --good: #2fa06e; --warn: #b8891f; --bad: #d96a4f;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 15px/1.62 var(--sans);
  padding-inline: 16px; padding-block: 30px 72px;
}
.wrap { max-width: 1020px; margin: 0 auto; display: grid; gap: 44px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.012em; text-wrap: balance; }
h1 { font-size: 27px; line-height: 1.22; font-weight: 700; }
h2 { font-size: 19px; line-height: 1.3; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

header.top { display: grid; gap: 13px; border-bottom: 2px solid var(--rule); padding-bottom: 20px; }
header.top .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.verdict { font-size: 18px; line-height: 1.5; max-width: 66ch; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; font-weight: 500;
  padding: 4px 9px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: var(--muted); }
.chip.good { color: var(--good); } .chip.good::before { background: var(--good); }
.chip.warn { color: var(--warn); } .chip.warn::before { background: var(--warn); }
.chip.bad  { color: var(--bad);  } .chip.bad::before  { background: var(--bad); }

section { display: grid; gap: 15px; }
.sec-head { display: grid; gap: 4px; border-bottom: 1px solid var(--rule); padding-bottom: 9px; }
.sec-head .n { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .1em; }
.sec-head p { font-size: 13px; color: var(--muted); max-width: 78ch; }

/* 측정 방법 — 데이터 위에 놓인다 */
.method { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--hair); border-radius: 5px; }
.method .m { display: grid; grid-template-columns: 8.5em 1fr; gap: 4px 14px; padding: 10px 15px; align-items: start; }
.method .m + .m { border-top: 1px solid var(--hair); }
.method .k { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding-top: 3px; }
.method .v { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); max-width: 74ch; }
.method .v strong { color: var(--ink); font-weight: 600; }
.method code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 2px; }
@media (max-width: 560px) { .method .m { grid-template-columns: 1fr; gap: 2px; } }

.bars { display: grid; gap: 3px; }
.bar-row { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 6em; gap: 12px; align-items: center; padding: 3px 0; font-size: 13.5px; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .name small { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-left: 4px; }
.track { position: relative; height: 15px; background: var(--surface-2); border-radius: 2px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 2px 4px 4px 2px; min-width: 2px; }
.fill.is-bad { background: var(--bad); } .fill.is-good { background: var(--good); }
.bar-row .v { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
.scale { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 6em; gap: 12px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.scale .ticks { position: relative; height: 13px; }
.scale .ticks span { position: absolute; transform: translateX(-50%); }
@media (max-width: 560px) { .bar-row, .scale { grid-template-columns: 6.2em minmax(0, 1fr) 4.8em; gap: 8px; } }

.chain-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.chain { background: var(--surface); border: 1px solid var(--hair); border-radius: 5px; padding: 12px 13px 10px; display: grid; gap: 9px; }
.chain .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chain .t .nm { font-weight: 600; font-size: 14px; }
.chain .t .x { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.chain .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-items: end; height: 54px; }
.chain .steps i { display: block; background: var(--bar-soft); border-top: 3px solid var(--bar); min-height: 3px; border-radius: 1px 1px 0 0; }
.chain .lbl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); text-align: center; }

h3.grp { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 10px; font-size: 14px; margin-top: 4px; }
h3.grp small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--hair); border-radius: 5px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 11px; border-bottom: 1px solid var(--hair); }
th { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .04em; color: var(--muted);
  background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.r { font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.cell { text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 46px; padding: 5px 4px; }

.readout { display: grid; background: var(--surface); border: 1px solid var(--hair); border-left: 3px solid var(--accent); border-radius: 4px; }
.readout .rd { display: grid; grid-template-columns: 6.8em 1fr; gap: 5px 14px; padding: 11px 15px; align-items: start; }
.readout .rd + .rd { border-top: 1px solid var(--hair); }
.readout .lbl { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .05em; padding-top: 3px; color: var(--muted); }
.readout .rd.did .lbl { color: var(--accent); }
.readout .rd.next .lbl { color: var(--good); }
.readout .body { display: grid; gap: 6px; min-width: 0; }
.readout p { font-size: 13.5px; line-height: 1.68; color: var(--ink-2); max-width: 74ch; }
.readout p strong { color: var(--ink); font-weight: 600; }
.readout code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 2px; }
@media (max-width: 560px) { .readout .rd { grid-template-columns: 1fr; gap: 2px; } }

.empty { padding: 16px; color: var(--muted); font-size: 13px; background: var(--surface); border: 1px dashed var(--rule); border-radius: 5px; }
details { background: var(--surface); border: 1px solid var(--hair); border-radius: 5px; }
details > summary { cursor: pointer; padding: 11px 15px; font-size: 13.5px; font-weight: 500; }
details[open] > summary { border-bottom: 1px solid var(--hair); }
details .in { padding: 12px 15px 15px; display: grid; gap: 10px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--ground);
  font: 400 12px/1.5 var(--mono); padding: 6px 9px; border-radius: 4px; max-width: 290px; white-space: pre-line; }
</style>

<div class="wrap" id="app"></div>
<div id="tip" hidden></div>

<script>
const DATA = /*__DATA__*/null;

const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null) continue;
    if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'class') n.className = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat(9)) {
    if (k == null || k === false) continue;
    n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return n;
};
// **굵게** 와 `코드` 를 실제 노드로 만든다. innerHTML을 쓰지 않는 이유가 둘이다:
// 데이터가 섞인 문자열을 HTML로 해석시키지 않고, 렌더 검사가 textContent로 내용을 읽을 수 있게 한다.
const rich = t => String(t).split(/(\*\*[^*]+\*\*|`[^`]+`)/).filter(Boolean).map(s =>
  s.startsWith('**') && s.endsWith('**') ? el('strong', {}, s.slice(2, -2))
    : s.startsWith('`') && s.endsWith('`') ? el('code', {}, s.slice(1, -1))
      : s);
const fmt = (v, d = 0) => v == null || Number.isNaN(v) ? '—'
  : Number(v).toLocaleString('ko-KR', { maximumFractionDigits: d });
const pct = v => v == null ? '—' : (v >= 0 ? '+' : '') + Math.round(v * 100) + '%';
const chip = (s, t) => el('span', { class: 'chip ' + (s || '') }, t);

const tip = document.getElementById('tip');
function hover(node, text) {
  if (!text) return node;
  const move = e => {
    const x = e.clientX, y = e.clientY;
    tip.style.left = Math.min(x + 12, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.max(8, y - tip.offsetHeight - 10) + 'px';
  };
  node.addEventListener('pointerenter', e => { tip.textContent = text; tip.hidden = false; move(e); });
  node.addEventListener('pointermove', move);
  node.addEventListener('pointerleave', () => { tip.hidden = true; });
  node.tabIndex = 0;
  node.addEventListener('focus', () => { tip.textContent = text; tip.hidden = false; });
  node.addEventListener('blur', () => { tip.hidden = true; });
  return node;
}

const SKILL = {
  BasicAttack: '화살 쏘기', Whirlwind: '회오리', Orb: '오브', Lightning: '피뢰침', EagleDrop: '독수리 투하',
  Sniping: '스나이핑', Homing: '호밍 미사일', Shotgun: '산탄', Rewind: '되감기', Swing: '휘두르기', GrapeToss: '포도 투척',
};
const sk = k => SKILL[k] || k;
const SCN = {
  swarm: '지상 무리', air_slow: '느린 비행', carrier: 'UFO 캐리어', shield: '방패', hopper: '콩콩이',
  rider: '고속 돌진', elite: '엘리트 물량', late: '후반 고체력', mix_ground: '지상 혼합', mix_air: '공중 혼합',
  mix_wall: '벽(방패와 엘리트)', tank: '단일 대상 지상', airship: '단일 대상 비행선', boss: '보스',
};
const scn = k => SCN[k] || k;
const STATES = [[0, -1, '기본'], [1, 0, 'R0 1차'], [2, 0, 'R0 2차'], [1, 1, 'R1 1차'], [2, 1, 'R1 2차']];

function readout(rows) {
  const box = el('div', { class: 'readout' });
  for (const [cls, label, items] of rows) {
    const list = (items || []).filter(Boolean);
    if (!list.length) continue;
    box.append(el('div', { class: 'rd ' + cls }, el('span', { class: 'lbl' }, label),
      el('div', { class: 'body' }, list.map(t => el('p', {}, rich(t))))));
  }
  return box;
}
// 절 머리말도 rich()를 거친다 — 그러지 않으면 굵게 표시가 별표 그대로 화면에 찍힌다.
const head = (n, title, note) =>
  el('div', { class: 'sec-head' }, el('div', { class: 'n' }, n), el('h2', {}, title), note ? el('p', {}, rich(note)) : null);

function bars(items, opts) {
  const o = opts || {};
  const max = Math.max(1, ...items.map(i => Math.abs(i.value) || 0));
  const box = el('div', { class: 'bars' });
  for (const i of items) {
    const fill = el('span', { class: 'fill' + (i.tone === 'bad' ? ' is-bad' : i.tone === 'good' ? ' is-good' : '') });
    fill.style.width = ((Math.abs(i.value) / max) * 100).toFixed(2) + '%';
    const row = el('div', { class: 'bar-row' },
      el('div', { class: 'name' }, i.label, i.sub ? el('small', {}, i.sub) : null),
      el('div', { class: 'track' }, fill),
      el('div', { class: 'v' }, i.text != null ? i.text : fmt(i.value)));
    hover(row, i.tip);
    box.append(row);
  }
  if (o.ticks) {
    const t = el('div', { class: 'ticks' });
    for (const v of o.ticks) {
      const s = el('span', {}, o.tickText ? o.tickText(v) : fmt(v));
      s.style.left = ((v / max) * 100).toFixed(2) + '%';
      t.append(s);
    }
    box.append(el('div', { class: 'scale' }, el('span', {}, o.axis || ''), t, el('span', {}, '')));
  }
  return box;
}

const app = document.getElementById('app');
const IT = (() => {
  const its = (DATA && DATA.iterations) || [];
  const withGym = its.filter(x => x.gym && x.gym.quality.cells > 0);
  if (!withGym.length) return null;
  // 🔴 "셀이 가장 많은 회차"로 고르면 **격자를 좁힌 최신 회차가 옛 전체 격자에 가려진다.**
  //    변경을 확인하는 회차는 건드린 스킬만 좁게 돌기 때문에 셀 수로는 늘 지고,
  //    그러면 방금 적용한 변경이 보고서에 한 번도 안 나온다.
  //    → 끝까지 돈(state가 done) 회차 중 **가장 최신**을 고르고, 끝난 회차가 없을 때만 셀이 가장 많은 것으로 물러선다
  //      (중간에 양보·중단된 반쯤 찬 회차를 기본으로 열지 않기 위한 가드).
  // 한 이터레이션에 세션이 여럿일 수 있다 — 중간에 양보·중단하고 다시 띄우면 그 회차의 세션이 둘이 된다.
  // 그래서 "전부 done"이 아니라 **도는 것이 없고 끝난 것이 하나라도 있으면** 끝난 회차로 본다.
  const done = withGym.filter(x => {
    const st = x.sessionStates || [];
    return st.length && !st.includes('running') && st.includes('done');
  });
  if (done.length) return done.reduce((a, b) => (b.iteration >= a.iteration ? b : a));
  return withGym.reduce((a, b) => (b.gym.quality.cells >= a.gym.quality.cells ? b : a));
})();

if (!IT) {
  app.append(el('header', { class: 'top' }, el('h1', {}, '스킬 시험장 판독지'),
    el('div', { class: 'empty' }, '시험장 측정이 아직 없습니다. mode를 gym으로 둔 봇 세션을 요청한 뒤 분석기를 다시 돌리세요.')));
} else {
  const G = IT.gym, Q = G.quality;
  const excluded = new Set((G.groups[0] && G.groups[0].excluded) || []);
  const solo = G.rows.filter(r => r.rig === 'solo' && r.level === 10 && r.growthCasts === 0);
  const at = (skill, stage, route, scenario) => solo.find(r => r.skill === skill && r.scenario === scenario
    && r.evoStage === stage && (stage === 0 || r.route === route));
  const dpsScn = G.scenarios.includes('tank') ? 'tank'
    : G.scenarios.find(s => G.rows.some(r => r.scenario === s && r.arenaKind === 'dps'));
  const attackSkills = [...new Set(solo.map(r => r.skill))].filter(s => !excluded.has(s)).sort();
  const best2 = (skill, scenario) => [at(skill, 2, 0, scenario), at(skill, 2, 1, scenario)]
    .filter(c => c && c.usable).sort((a, b) => b.dps - a.dps)[0];
  const rank = attackSkills.map(s => {
    const c = best2(s, dpsScn), pre = at(s, 0, -1, dpsScn);
    return c ? { skill: s, dps: c.dps, route: c.route, pre: pre && pre.usable ? pre.dps : null } : null;
  }).filter(Boolean).sort((a, b) => b.dps - a.dps);

  // 🔴 **머리 문장은 단일 대상 서열로 쓰지 않는다.** 그 한 무대의 숫자는 "얼마나 센가"가 아니라
  //    "얼마나 단일 대상에 특화됐나"를 잰다. 독수리 투하는 단일 대상 157인데 지상 무리에서는 8,045다 — 광역기라서다.
  //    스킬끼리 공평하게 비교하려면 **각 스킬이 가장 잘하는 상황에서 그 상황 중앙값을 얼마나 넘는지**를 본다.
  const scnMedian = {};
  for (const scName of G.scenarios) {
    const v = attackSkills.map(x => best2(x, scName)).filter(Boolean).map(c => c.dps);
    scnMedian[scName] = v.length ? v.slice().sort((a, b) => a - b)[v.length >> 1] : null;
  }
  const bestOf = skill => G.scenarios.map(scName => {
    const c = best2(skill, scName);
    return c && scnMedian[scName] > 0 ? { scn: scName, nv: c.dps / scnMedian[scName], dps: c.dps } : null;
  }).filter(Boolean).sort((a, b) => b.nv - a.nv)[0];
  const strength = attackSkills.map(s => ({ skill: s, best: bestOf(s) })).filter(x => x.best)
    .sort((a, b) => b.best.nv - a.best.nv);
  const noStrength = strength.filter(x => x.best.nv <= 1.0);

  // ── 머리 ──
  app.append(el('header', { class: 'top' },
    el('div', { class: 'eyebrow' }, '블루베리 디펜스 · 스킬 시험장'),
    el('h1', {}, '스킬 시험장 판독지'),
    el('p', { class: 'verdict' }, rich(strength.length
      ? (noStrength.length
        ? `2차 진화체 ${strength.length}개 중 **${noStrength.map(x => sk(x.skill)).join(' · ')}** 는 ${fmt(G.scenarios.length)}개 상황 **어디에서도 중앙값을 못 넘습니다.** 나머지는 각자 잘하는 상황이 있고, 가장 뚜렷한 것은 ${sk(strength[0].skill)}입니다. ${scn(strength[0].best.scn)}에서 중앙값의 ${fmt(strength[0].best.nv, 1)}배입니다.`
        : `2차 진화체 ${strength.length}개가 모두 잘하는 상황을 하나 이상 갖고 있습니다. 가장 뚜렷한 것은 ${sk(strength[0].skill)}이고, ${scn(strength[0].best.scn)}에서 중앙값의 ${fmt(strength[0].best.nv, 1)}배입니다.`)
      : '2차 진화 비교를 아직 채우지 못했습니다.')),
    el('div', { class: 'chips' },
      chip(Q.usable === Q.cells ? 'good' : '', `쓸 수 있는 셀 ${fmt(Q.usable)} / ${fmt(Q.cells)}`),
      Q.rigFailed.length ? chip('bad', `상태 강제 실패 ${Q.rigFailed.length}`) : chip('good', '상태 강제 실패 없음'),
      (Q.residual || []).length ? chip('bad', `앞 셀 오염 ${Q.residual.length}`) : chip('good', '앞 셀 오염 없음'),
      (Q.arenaLimited || []).length ? chip('warn', `무대 천장 ${Q.arenaLimited.length}`) : chip('good', '무대 천장 없음')),
    el('div', { class: 'meta' },
      el('span', {}, `이터레이션 ${IT.iteration}`),
      IT.plan && IT.plan.verdict ? el('span', {}, `판정 ${IT.plan.verdict}`) : null,
      el('span', {}, `셀 ${fmt(Q.cells)}개`),
      el('span', {}, new Date(DATA.generatedUtc).toLocaleString('ko-KR')))));

  // ── §00 측정 방법 — 데이터보다 위 ──
  {
    const s = el('section', {});
    s.append(head('00', '이 숫자는 어떻게 나왔는가', '아래 모든 표는 같은 조건에서 나왔습니다. 조건을 모르면 숫자를 잘못 읽습니다.'));
    const rows = [
      ['무엇을 재나', '스킬을 **하나만** 들고 고정된 적 구성을 상대합니다. 같은 스킬을 진화 상태마다 따로 재서, 상태끼리 비교할 수 있게 만듭니다.'],
      ['한 칸의 조건', `스킬 하나 · 진화 상태 하나 · 레벨 하나 · 적 구성 하나. 이 넷을 정해 놓고 **고정된 게임 시간** 동안 돌립니다. 상황마다 45초에서 60초입니다. 그 한 번을 셀이라고 부르고, 이번에는 ${fmt(Q.cells)}칸을 돌렸습니다.`],
      ['진화 상태', '기본 · R0 1차 · R0 2차 · R1 1차 · R1 2차, 다섯 가지입니다. 진화 조건과 2차 열쇠는 무시하고 상태를 직접 세웁니다. 그래서 실제 게임에서 만들기 어려운 진화체도 똑같이 측정됩니다.'],
      ['레벨', '**1레벨과 10레벨을 둘 다** 잽니다. 성장 폭이 상황마다 달라서, 10레벨만 재면 그 차이가 보이지 않습니다.'],
      ['스킬트리', '**그 스킬의 강화 노드 둘만** 켭니다. 은별과 금별입니다. 공격력이나 쿨타임 같은 일반 노드는 모든 스킬에 똑같이 얹혀서 비교를 흐리므로 사지 않습니다. 패시브도 없습니다.'],
      ['무대', `적 구성은 ${fmt(G.scenarios.length)}가지입니다. 스테이지 표와 난이도 배율을 쓰지 않고 시험장이 적 세기를 직접 정합니다. 그래서 맵 밸런스를 바꿔도 이 숫자는 움직이지 않습니다.`],
      ['체력 잠금', '플레이어가 죽지 않습니다. 모든 칸이 시간을 끝까지 채워야 서로 비교가 되기 때문입니다. 대신 죽는지는 재지 않고 **받은 피해**와 **놓친 적**으로 읽습니다.'],
      ['숫자의 뜻', '**초당 유효딜**입니다. 적의 남은 체력을 넘은 몫은 빼고 셉니다. 시험 대상이 만든 딜은 이름이 달라도 모두 더합니다. 게임이 딜 출처를 오브젝트 종류로 적기 때문입니다. 예를 들어 독수리 투하가 뿜는 회오리는 회오리 이름으로 기록됩니다.'],
      ['비교 범위', '적 체력을 진화 차수마다 다르게 두었습니다. 1배 · 3배 · 9배입니다. 한 무대로는 기본과 2차의 파워 차이를 담을 수 없기 때문입니다. **그래서 차수를 넘는 비교는 적이 죽지 않는 단일 대상 무대에서만** 합니다.'],
      ['못 재는 것', '되감기 · 피뢰침 · 집중 산탄은 혼자 두면 딜이 거의 없습니다. 남의 쿨타임과 타수를 건드리는 스킬이라 그렇습니다. 이 셋은 06절에서 따로 잽니다.'],
      ['판정 하한', `같은 칸을 순서의 앞과 뒤에 두 번 넣어 잰 차이가 ${G.noise.maxSpread != null ? '최대 ' + Math.round(G.noise.maxSpread * 100) + '%' : '앞선 회차 기준 4.5%'}입니다. 이보다 작은 차이는 판정하지 않습니다.`],
    ];
    const m = el('div', { class: 'method' });
    for (const [k, v] of rows)
      m.append(el('div', { class: 'm' }, el('span', { class: 'k' }, k), el('div', { class: 'v' }, rich(v))));
    s.append(m);
    app.append(s);
  }

  // ── §01 전 스킬 × 전 진화 단계 파워 표 ──
  // 한 절에서 세 가지를 답한다: ① 전 스킬을 진화 단계별로 나란히 놓은 표 ② 목표 밴드 안에 몇 퍼센트가 드는가 ③ 단계별 순위.
  // 🔴 파워의 정의는 여기 한 곳에만 둔다. 아래 절들은 각자 다른 질문(가장 잘하는 상황 · 진화 배율)을 보므로 숫자가 다르다.
  const BAND = (DATA.targets && DATA.targets.skillPowerBand) || [0.7, 1.4];
  const median = a => {
    const v = a.slice().sort((x, y) => x - y);
    if (!v.length) return null;
    return v.length % 2 ? v[v.length >> 1] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
  };
  // 진화 차수마다 적 체력이 1배·3배·9배로 달라서 차수를 넘는 비교가 안 된다.
  // 그래서 **그룹 안에서만** 중앙값을 세우고, 그 중앙값 대비 배율로 줄을 세운다.
  const STAGE_GROUPS = [
    [0, '기본 — 진화 전', [[0, -1, '']]],
    [1, '1차 진화', [[1, 0, 'R0'], [1, 1, 'R1']]],
    [2, '2차 진화', [[2, 0, 'R0'], [2, 1, 'R1']]],
  ];
  const powerGroups = STAGE_GROUPS.map(([stage, label, states]) => {
    const keys = [];
    for (const s of attackSkills)
      for (const [st, rt, rl] of states)
        keys.push({ skill: s, stage: st, route: rt, label: sk(s), sub: rl });
    const medBy = {};
    for (const scName of G.scenarios) {
      const v = keys.map(k => at(k.skill, k.stage, k.route, scName))
        .filter(c => c && c.usable && c.dps > 0).map(c => c.dps);
      // 표본이 셋 미만이면 그 상황의 중앙값을 신뢰할 수 없으므로 그 상황을 버린다.
      medBy[scName] = v.length >= 3 ? median(v) : null;
    }
    const rows = keys.map(k => {
      const per = G.scenarios.map(scName => {
        const c = at(k.skill, k.stage, k.route, scName);
        return c && c.usable && medBy[scName] > 0
          ? { scn: scName, nv: c.dps / medBy[scName], dps: c.dps } : null;
      }).filter(Boolean);
      if (per.length < 5) return null;   // 상황 다섯 곳을 못 채운 상태는 줄 세우지 않는다
      const byNv = per.slice().sort((a, b) => b.nv - a.nv);
      return Object.assign({}, k, {
        power: median(per.map(p => p.nv)), top: byNv[0], bot: byNv[byNv.length - 1], n: per.length,
      });
    }).filter(Boolean).sort((a, b) => b.power - a.power);
    const inBand = rows.filter(r => r.power >= BAND[0] && r.power <= BAND[1]);
    const lo = rows.length ? rows[rows.length - 1].power : null;
    return {
      stage, label, rows, inBand: inBand.length,
      over: rows.filter(r => r.power > BAND[1]).length,
      under: rows.filter(r => r.power < BAND[0]).length,
      pctIn: rows.length ? inBand.length / rows.length : null,
      spread: lo > 0 ? rows[0].power / lo : null,
    };
  }).filter(g => g.rows.length);

  {
    const s = el('section', {});
    s.append(head('01', '전 스킬 · 전 진화 단계 파워 표',
      `한 상태의 파워는 그 상황의 중앙값 대비 배율을, 여러 상황에 걸쳐 다시 중앙값 낸 값입니다. `
      + `1배가 그 단계의 평균이고 목표 밴드는 \`${BAND[0]}\`배에서 \`${BAND[1]}\`배입니다. `
      + `🔴 **같은 단계끼리만 비교합니다** — 단계마다 적 체력을 1배·3배·9배로 다르게 두었기 때문입니다. `
      + `중앙값을 세울 때 빼는 것 셋: 쓸 수 없는 칸(앞 셀 오염·무대 천장·상태 강제 실패) · 딜이 0인 칸 · `
      + `혼자서는 딜이 없는 버프 스킬 세 개. 상황마다 표본이 셋 미만이면 그 상황을 버리고, `
      + `상황 다섯 곳을 못 채운 상태는 줄을 세우지 않습니다. **이 규칙이 바뀌면 비율도 바뀝니다** — 다른 숫자와 견줄 때 규칙을 먼저 맞추십시오.`));

    if (!powerGroups.length) s.append(el('div', { class: 'empty' }, '파워를 낼 만큼 셀이 모이지 않았습니다.'));
    else {
      const allRows = powerGroups.flatMap(g => g.rows);
      const allIn = powerGroups.reduce((a, g) => a + g.inBand, 0);
      s.append(el('div', { class: 'chips' },
        chip(allIn / allRows.length >= 0.7 ? 'good' : allIn / allRows.length >= 0.4 ? 'warn' : 'bad',
          `전체 밴드 안 ${allIn} / ${allRows.length} (${Math.round(100 * allIn / allRows.length)}%)`),
        ...powerGroups.map(g => chip(g.pctIn >= 0.7 ? 'good' : g.pctIn >= 0.4 ? 'warn' : 'bad',
          `${g.label} ${g.inBand}/${g.rows.length} (${Math.round(100 * g.pctIn)}%)`))));

      for (const g of powerGroups) {
        s.append(el('h3', { class: 'grp' }, g.label,
          el('small', {}, `상태 ${g.rows.length}개 · 밴드 안 ${g.inBand}개`
            + ` · 초과 ${g.over}개 · 미달 ${g.under}개`
            + (g.spread ? ` · 최고÷최저 ${fmt(g.spread, 1)}배` : ' · 최저가 0이라 배율을 못 냄'))));
        s.append(el('div', { class: 'scroll' }, el('table', {},
          el('thead', {}, el('tr', {},
            el('th', { class: 'r' }, '순위'), el('th', {}, '스킬'), el('th', { class: 'r' }, '파워'),
            el('th', {}, '밴드'), el('th', {}, '가장 센 상황'), el('th', { class: 'r' }, '배율'),
            el('th', {}, '가장 약한 상황'), el('th', { class: 'r' }, '배율'))),
          el('tbody', {}, g.rows.map((r, i) => el('tr', {},
            el('td', { class: 'r mono muted' }, i + 1),
            el('td', {}, r.label, r.sub ? el('small', { class: 'muted mono' }, ' ' + r.sub) : null),
            hover(el('td', { class: 'r mono' }, fmt(r.power, 2) + '배'),
              `${sk(r.skill)}${r.sub ? ' ' + r.sub : ''} · ${g.label}\n`
              + `상황 ${r.n}곳에서 잰 배율의 중앙값 ${r.power.toFixed(2)}\n`
              + `가장 센 곳 ${scn(r.top.scn)} ${r.top.nv.toFixed(2)}배 (${fmt(r.top.dps)} dps)\n`
              + `가장 약한 곳 ${scn(r.bot.scn)} ${r.bot.nv.toFixed(2)}배 (${fmt(r.bot.dps)} dps)`),
            el('td', {}, r.power > BAND[1] ? chip('bad', '초과')
              : r.power < BAND[0] ? chip('warn', '미달') : chip('good', '안')),
            el('td', {}, scn(r.top.scn)),
            el('td', { class: 'r mono' }, fmt(r.top.nv, 2) + '배'),
            el('td', {}, scn(r.bot.scn)),
            el('td', { class: 'r mono' }, fmt(r.bot.nv, 2) + '배')))))));
      }

      const worst = powerGroups.slice().sort((a, b) => a.pctIn - b.pctIn)[0];
      const over = allRows.filter(r => r.power > BAND[1]).sort((a, b) => b.power - a.power);
      const under = allRows.filter(r => r.power < BAND[0]).sort((a, b) => a.power - b.power);
      const nm = r => sk(r.skill) + (r.sub ? ' ' + r.sub : '');
      s.append(readout([
        ['now', '해석', [
          `밴드 안에 든 것은 전체 ${allRows.length}개 상태 중 **${allIn}개(${Math.round(100 * allIn / allRows.length)}%)** 입니다. `
          + powerGroups.map(g => `${g.label} ${Math.round(100 * g.pctIn)}%`).join(' · ') + '.',
          `🔴 **진화를 거칠수록 벌어집니다.** 가장 안 맞는 단계는 **${worst.label}** 로, `
          + `${worst.rows.length}개 중 ${worst.inBand}개만 밴드 안입니다`
          + (worst.spread ? ` (최고÷최저 ${fmt(worst.spread, 1)}배)` : ' (최저가 0이라 배율을 못 냅니다)') + '.',
          over.length
            ? `밴드를 넘은 것은 ${over.length}개이고 가장 센 것은 **${nm(over[0])}** ${fmt(over[0].power, 2)}배입니다`
              + (over.length > 1 ? `, 그다음이 ${nm(over[1])} ${fmt(over[1].power, 2)}배입니다.` : '.')
            : '밴드를 넘은 상태는 없습니다.',
          under.length
            ? `밴드에 못 미친 것은 ${under.length}개이고 가장 약한 것은 **${nm(under[0])}** ${fmt(under[0].power, 2)}배입니다.`
            : '밴드에 못 미친 상태는 없습니다.',
          '🔴 파워가 모두 같을 필요는 없습니다. 밴드는 **고를 이유가 생기는 구간**이고, 넘으면 다른 선택지를 지우고 못 미치면 그 자신이 지워집니다.',
        ]],
        ['did', '내가 만진 것', [
          '이 표를 이번에 새로 넣었습니다. 전에는 각 스킬이 가장 잘하는 상황만 보여서 **절대 파워가 밴드 안인지**가 안 보였습니다.',
          '🔴 **순위를 단일 대상 무대의 초당 딜로 세우지 않습니다.** 그 숫자는 "얼마나 센가"가 아니라 "얼마나 단일 대상에 특화됐나"를 잽니다. 광역기가 최하위로 보입니다.',
          IT.plan && IT.plan.changes && IT.plan.changes.length
            ? `이번 회차에 데이터 에셋 ${IT.plan.changes.length}묶음을 고쳤습니다. 무엇을 왜 고쳤는지는 마지막 절에 있습니다.`
            : '이번 회차에는 밸런스 수치를 바꾸지 않았습니다.',
        ]],
        ['next', '다음에 볼 것', [
          over.length
            ? `넘친 쪽부터 줄입니다. **진화 스킬이 강하면 쿨타임부터**(\`Evo_*.baseCooldown\`) 만지고, 그걸로 안 되면 피해를 만집니다.`
            : '넘친 쪽은 없습니다.',
          under.length
            ? `못 미친 쪽은 **가장 덜 뒤진 상황의 축**을 올립니다. 전체 피해를 올리면 순위만 뒤집히고 정체성은 생기지 않습니다. 어느 상황이 덜 뒤졌는지는 이 표의 "가장 센 상황" 칸에 있습니다.`
            : '못 미친 쪽은 없습니다.',
          '⚠️ 되감기 · 피뢰침 · 집중 산탄은 이 표에 없습니다. 혼자서는 딜이 거의 없는 스킬이라 파워 배율로 판정할 수 없고, 뒤쪽 동반 릭 절에서 따로 잽니다.',
        ]],
      ]));
    }
    app.append(s);
  }

  // ── §02 2차 진화 서열 ──
  {
    const s = el('section', {});
    s.append(head('02', '2차 진화체마다 가장 잘하는 상황', `${fmt(G.scenarios.length)}개 상황 중 그 스킬이 가장 센 곳. 값은 그 상황의 중앙값 대비 배율입니다. 1배가 평균이고, 1배를 못 넘으면 어디에서도 남보다 낫지 않다는 뜻입니다.`));
    if (!strength.length) s.append(el('div', { class: 'empty' }, '2차 진화 셀이 아직 없습니다.'));
    else {
      s.append(bars(strength.map(x => ({
        label: sk(x.skill), sub: scn(x.best.scn), value: x.best.nv, text: fmt(x.best.nv, 1) + '배',
        tone: x.best.nv <= 1.0 ? 'bad' : x.best.nv > 5 ? 'good' : null,
        tip: `${sk(x.skill)} 2차\n가장 센 상황 ${scn(x.best.scn)}\n그 상황 중앙값의 ${x.best.nv.toFixed(2)}배 (${fmt(x.best.dps)} dps)`,
      })), { axis: '중앙값 대비', ticks: [0, 1, strength[0].best.nv], tickText: v => fmt(v, 1) + '배' }));
      s.append(readout([
        ['now', '해석', [

      if ((R.challenges || []).length)
        s.append(el('div', { class: 'scroll' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, '대상'), el('th', {}, '반론'),
            el('th', {}, '판정'), el('th', {}, '제안자의 응답'), el('th', {}, '결과'))),
          el('tbody', {}, R.challenges.map(c => el('tr', {},
            el('td', { class: 'mono muted' }, c.against || ''),
            el('td', {}, rich(c.objection || '')),
            el('td', {}, c.verdict === '지지됨' ? chip('good', c.verdict)
              : c.verdict === '철회 권고' ? chip('bad', c.verdict) : chip('warn', c.verdict || '—')),
            el('td', { class: 'muted' }, c.response || ''),
            el('td', {}, c.outcome === '철회' ? chip('bad', c.outcome)
              : c.outcome === '수정' ? chip('warn', c.outcome) : chip('good', c.outcome || '유지'))))))));

      // R3 — 같은 필드에 제안이 겹쳤을 때 무엇을 근거로 골랐나
      if ((R.conflicts || []).length) {
        s.append(el('h3', { class: 'grp' }, '같은 손잡이에 제안이 겹친 곳',
          el('small', {}, '필드 하나당 변경 하나로 합쳤습니다 — 둘을 같이 밀면 어느 쪽이 들었는지 판정할 수 없습니다')));
        s.append(el('div', { class: 'scroll' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, '손잡이'), el('th', {}, '경합한 제안'),
            el('th', {}, '채택'), el('th', {}, '고른 근거'))),
          el('tbody', {}, R.conflicts.map(c => el('tr', {},
            el('td', { class: 'mono', style: 'font-size:11.5px' }, c.field || ''),
            el('td', { class: 'mono muted' }, (c.proposals || []).join(' · ')),
            el('td', { class: 'mono' }, c.chosen || ''),
            el('td', {}, rich(c.reason || ''))))))));
      }

      // 최종 채택·기각
      if ((R.decisions || []).length)
        s.append(el('div', { class: 'scroll' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, '번호'), el('th', {}, '무엇을'),
            el('th', {}, '최종 값'), el('th', {}, '판정'), el('th', {}, '이유'))),
          el('tbody', {}, R.decisions.map(d2 => el('tr', {},
            el('td', { class: 'mono muted' }, d2.id || ''),
            el('td', { class: 'mono', style: 'font-size:11.5px' }, d2.target || ''),
            el('td', { class: 'mono' }, d2.finalAfter != null ? String(d2.finalAfter) : '—'),
            el('td', {}, d2.verdict === '채택' ? chip('good', d2.verdict) : chip('bad', d2.verdict || '기각')),
            el('td', { class: 'muted' }, d2.reason || '')))))));
    }

    const rd = [];
    if (M.howDecided) rd.push(['now', '무엇을 기준으로 정했나', [M.howDecided].flat()]);
    if (M.disagreements) rd.push(['did', '끝까지 안 맞은 것', [M.disagreements].flat()]);
    if (M.nextRound) rd.push(['next', '다음 회의에 가져갈 것', [M.nextRound].flat()]);
    if (rd.length) s.append(readout(rd));
    app.append(s);
  }
}
</script>
