<title>블루베리 밸런스 랩</title>
<meta name="description" content="봇 플레이테스트 루프의 목표 달성 현황·이터레이션별 가설과 판정·스킬·캐릭터·난이도 지표">

<style>

    --warning-ink: #fab219;
    --serious-ink: #ec835a;

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 400 14px/1.6 var(--sans);
  padding-inline: 16px;
  padding-block: 28px 64px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 40px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 30px; line-height: 1.2; font-weight: 700; }
h2 { font-size: 20px; line-height: 1.3; }
h3 { font-size: 15px; line-height: 1.4; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
header.top .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--ink-2); font-size: 13px; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--hair); border-radius: 6px; padding: 4px 8px; }
select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section { display: grid; gap: 14px; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; border-bottom: 1px solid var(--hair); padding-bottom: 8px; }
.section-head p { color: var(--muted); font-size: 13px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; line-height: 1; padding: 4px 8px 4px 6px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.pass { color: var(--good-ink); } .chip.pass::before { background: var(--good); }
.chip.fail { color: var(--critical-ink); } .chip.fail::before { background: var(--critical); }
.chip.warn { color: var(--warning-ink); } .chip.warn::before { background: var(--warning); }
.chip.info { color: var(--accent); } .chip.info::before { background: var(--accent); }

/* 스코어보드 */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; }
.tile { background: var(--surface); padding: 14px 16px 12px; display: grid; gap: 6px; align-content: start; min-height: 132px; }
.tile .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile .code { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.tile .label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.tile .value { font-size: 28px; font-weight: 600; line-height: 1.1; }
.tile .target { font-size: 12px; color: var(--muted); }
.tile svg { display: block; }
@media (max-width: 860px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .board { grid-template-columns: 1fr; } }

/* 표 */
.scroll { overflow-x: auto; border: 1px solid var(--hair); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--hair); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.num, td.r { font-variant-numeric: tabular-nums; }
td.cell { text-align: center; font-variant-numeric: tabular-nums; min-width: 44px; padding: 6px 4px; }

/* 이터레이션 타임라인 */
.iter { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 18px 20px; display: grid; gap: 14px; }
.iter.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.iter-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.iter-head h3 { font-size: 17px; }
.kv { display: grid; grid-template-columns: 7.5em 1fr; gap: 6px 14px; }
.kv dt { color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.kv dd { margin: 0; }
.hypo { font-size: 15px; font-weight: 500; max-width: 70ch; }
.axis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.axis { border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.axis.chosen { border-color: var(--accent); background: var(--accent-wash); }
.axis .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.axis .name { font-weight: 600; font-size: 13px; }
.score { display: inline-flex; gap: 2px; }
.score i { width: 8px; height: 8px; border-radius: 2px; background: var(--hair); display: block; }
.score i.on { background: var(--accent); }
.axis p { font-size: 12.5px; color: var(--ink-2); }
.changes code { white-space: nowrap; }
.arrow { color: var(--muted); padding-inline: 4px; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* 난이도 사다리 */
.ladder { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 16px; }
.rung { display: grid; grid-template-columns: 7.5em 1fr 4.5em; gap: 12px; align-items: center; min-height: 30px; }
.rung .bar { height: 10px; background: var(--seq-0); border-radius: 0 4px 4px 0; position: relative; }
.rung .bar span { position: absolute; inset: 0 auto 0 0; background: var(--series-1); border-radius: 0 4px 4px 0; }
.rel { display: grid; grid-template-columns: 7.5em 1fr; gap: 12px; font-size: 12px; min-height: 20px; align-items: center; }
.rel .op { font-family: var(--mono); color: var(--ink-2); padding-left: 2.2em; }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.empty { padding: 18px; color: var(--muted); background: var(--surface); border: 1px dashed var(--axis); border-radius: 10px; font-size: 13px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 13px; border: 1px solid var(--hair); background: var(--surface); color: var(--ink-2); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.chart { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px; }
.chart svg { width: 100%; height: auto; display: block; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--page); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 280px; line-height: 1.45; }
@media (prefers-reduced-motion: no-preference) { .tabs button { transition: background .12s ease; } }
</style>

<div class="wrap" id="app"></div>
<div id="tip" hidden></div>

<script>
const DATA = /*__DATA__*/null;

// ───── 이름표 ─────
const SKILL = { BasicAttack: '화살', Swing: '휘두르기', GrapeToss: '포도', Whirlwind: '회오리', Orb: '오브', Lightning: '낙뢰', EagleDrop: '독수리', Sniping: '스나이핑', Homing: '호밍', Shotgun: '산탄', Rewind: '되감기', Other: '기타' };
const CHAR = { Char_Strawberry: '딸기', Char_Pineapple: '파인애플', Char_Slot3: '포도' };
const ENEMY = { Blueberry: '블루베리', Regent: '엘리트', PaperPlane: '종이비행기', Ufo: 'UFO', Shield: '방패', Rider: '라이더', Hopper: '콩콩이', Surfer: '서핑', Airship: '비행선', Boss: '보스', Treasure: '보물' };
const AXIS = { A: '맵', B: '스킬 파워', C: '스킬트리 파워', D: '경제·진행 속도', E: '캐릭터' };
const VERDICT = { confirmed: ['확인', 'pass'], refuted: ['반박', 'fail'], inconclusive: ['불확실', 'warn'], pending: ['검증 대기', 'info'] };
const enemyName = k => ENEMY[(k || '').replace('EnemyDef_', '')] || k;
const skillName = k => SKILL[k] || k;
const charName = k => CHAR[k] || k;

// ───── DOM 도우미 ─────
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const svg = (tag, attrs) => { const el = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v); return el; };
const fmt = (v, d = 2) => v == null || Number.isNaN(v) ? '—' : (typeof v === 'number' ? (Math.abs(v) >= 100 ? v.toLocaleString('ko-KR', { maximumFractionDigits: 0 }) : v.toLocaleString('ko-KR', { maximumFractionDigits: d })) : v);
const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
const chip = (state, text) => h('span', { class: 'chip ' + state }, text);
const passChip = (m) => m == null || m.value == null || (typeof m.value === 'string' && /^0\/0/.test(m.value)) ? chip('', '측정 전') : m.pass ? chip('pass', '통과') : chip('fail', '미달');

const tip = document.getElementById('tip');
function hover(el, text) {
  el.addEventListener('mousemove', e => { tip.hidden = false; tip.textContent = text; tip.style.left = Math.min(e.clientX + 12, innerWidth - 290) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
  el.addEventListener('mouseleave', () => { tip.hidden = true; });
}
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function seqColor(v) { // 0..1 → 한 색조 7단
  if (v == null) return 'transparent';
  const i = Math.max(0, Math.min(6, Math.round(v * 6)));
  return `var(--seq-${i})`;
}
function inkOn(v) { return v != null && v > 0.55 ? '#ffffff' : 'var(--ink)'; }

// ───── 렌더 ─────
function render(idx) {
  const app = document.getElementById('app');
  app.replaceChildren();
  if (!DATA || !DATA.iterations || !DATA.iterations.length) {
    app.append(h('header', { class: 'top' }, h('h1', {}, '블루베리 밸런스 랩')), h('div', { class: 'empty' }, '아직 기록된 봇 세션이 없습니다. BotRuns/request.json으로 세션을 요청한 뒤 analyze.js를 다시 돌리세요.'));
    return;
  }
  const iters = DATA.iterations;
  const it = iters[idx];
  const final = DATA.loop && DATA.loop.final;

  // 헤더
  const sel = h('select', { id: 'iter-select', 'aria-label': '볼 이터레이션', onchange: e => render(+e.target.value) },
    iters.map((x, i) => h('option', { value: i, selected: i === idx ? 'selected' : null }, `이터레이션 ${x.iteration}${i === iters.length - 1 ? ' (최신)' : ''}`)));
  app.append(h('header', { class: 'top' },
    h('div', {}, h('div', { class: 'eyebrow' }, '블루베리 디펜스 · 봇 플레이테스트'), h('h1', {}, '블루베리 밸런스 랩')),
    h('div', { class: 'meta' },
      final ? chip('pass', '루프 종료 · 최종') : chip('info', '루프 진행 중'),
      h('span', { class: 'num' }, `세션 ${DATA.sessions.length}개 · 판 ${DATA.sessions.reduce((a, s) => a + s.runs, 0).toLocaleString('ko-KR')}개`),
      h('span', { class: 'muted num' }, '갱신 ' + new Date(DATA.generatedUtc).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' })),
      sel)));

  app.append(scoreboard(iters, idx));
  app.append(timeline(iters, idx));
  app.append(goalsSection(it));
  app.append(characterSection(it));
  app.append(skillSection(it));
  app.append(cooldownSection(it));
  app.append(progressSection(it));
  app.append(deathSection(it));
}

function sectionHead(title, note) {
  return h('div', { class: 'section-head' }, h('h2', {}, title), note ? h('p', {}, note) : null);
}

// 스코어보드
function scoreboard(iters, idx) {
  const T = DATA.targets;
  const defs = [
    ['G1', '총 플레이타임', m => m.value == null ? '—' : fmt(m.value, 0) + '분', `목표 ${T.playtimeMinutes[0]}–${T.playtimeMinutes[1]}분 · 전 노드 + 우주 어려움`, m => m.value],
    ['G2', '난이도 서열', m => m.measured ? m.value : '—', '관계 8개 · 농장1 < … < 우주3', m => m.measured ? +String(m.value).split('/')[0] : null],
    ['G3', '목표별 판수 균일', m => fmt(m.value, 2), `변동계수 ≤ ${T.attemptsCvMax}`, m => m.value],
    ['G4', '풀트리 우주 어려움', m => m.value == null ? '—' : pct(m.value), `캐릭터별 클리어율 ≥ ${pct(T.fullTreeClearRateMin)}`, m => m.value],
    ['G5', '스킬 밸런스', m => m.value, '지배 없음 · 장점 1개 이상 · 종합 0.7–1.4', null],
    ['G6', '캐릭터 편차', m => fmt(m.value, 2), `같은 목표에서 난이도 차 ≤ ${T.characterSpreadMax}`, m => m.value],
    ['C1', '쿨 15초 초과', m => m.value == null ? '—' : m.value + '건', '하드 제약 · 0건이어야 함', m => m.value],
    ['C2', '진화 쿨 원칙 미충족', m => m.value == null ? '—' : m.value + '건', '진화하면 쿨이 길어져야 함', m => m.value],
  ];
  const board = h('div', { class: 'board' });
  for (const [code, label, show, target, series] of defs) {
    const m = iters[idx].scoreboard[code] || {};
    const tile = h('div', { class: 'tile' },
      h('div', { class: 'row' }, h('span', { class: 'code' }, code), passChip(m)),
      h('div', { class: 'label' }, label),
      h('div', { class: 'value num' }, show(m)),
      h('div', { class: 'target' }, code === 'C2' && m.shorter ? `${target} · 오히려 짧아짐 ${m.shorter}건` : target));
    if (series) {
      const vals = iters.slice(0, idx + 1).map(x => series(x.scoreboard[code] || {}));
      if (vals.filter(v => v != null).length >= 2) tile.append(sparkline(vals));
    }
    board.append(tile);
  }
  return h('section', {}, sectionHead('목표 달성 현황', '선택한 이터레이션 기준. 아래 작은 선은 이터레이션별 추이'), board);
}

function sparkline(vals) {
  const W = 160, H = 28, pad = 4;
  const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
  const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  const x = i => pad + (i / Math.max(1, vals.length - 1)) * (W - pad * 2);
  const y = v => hi === lo ? H / 2 : H - pad - ((v - lo) / (hi - lo)) * (H - pad * 2);
  const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, 'aria-hidden': 'true' });
  s.append(svg('polyline', { points: pts.map(p => `${x(p[0])},${y(p[1])}`).join(' '), fill: 'none', stroke: 'var(--muted)', 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  const last = pts[pts.length - 1];
  s.append(svg('circle', { cx: x(last[0]), cy: y(last[1]), r: 3, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 1.5 }));
  return s;
}

// 이터레이션 타임라인
function timeline(iters, idx) {
  const sec = h('section', {}, sectionHead('이터레이션 기록', '루프마다 겨냥한 목표 → 손잡이 선택 분석 → 변경 → 다음 루프의 판정'));
  const list = h('div', { style: 'display:grid;gap:12px' });
  for (let i = iters.length - 1; i >= 0; i--) {
    const it = iters[i], p = it.plan;

  const maxStage = Math.max(...goals.map(g => g.finalStage || 15));
  const stages = Array.from({ length: maxStage }, (_, i) => i + 1);
  const table = h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, '목표'), stages.map(s => h('th', { class: 'r' }, s)), h('th', {}, '막타 상위'))),
    h('tbody', {}, goals.map(g => h('tr', {}, h('td', { style: 'white-space:nowrap' }, g.name, h('div', { class: 'muted num', style: 'font-size:11.5px' }, `${g.runs}판`)),
      stages.map(s => {
        const reached = g.reached[s] || 0, rate = g.deathRate[s];
        if (s > (g.finalStage || 15)) return h('td', { class: 'cell', style: 'background:var(--surface-2)' }, '');
        const td = h('td', { class: 'cell', style: `background:${reached ? seqColor(rate) : 'transparent'};color:${inkOn(rate)}` }, reached && rate ? Math.round(rate * 100) : '');
        hover(td, `${g.name} · ${s}스테이지 · 도달 ${reached}판 · 사망 ${g.deaths[s] || 0}판`);
        return td;
      }),
      h('td', { style: 'white-space:nowrap' }, Object.entries(g.causes).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([e, n]) => `${enemyName(e)} ${n}`).join(' · ') || '—')))));
  sec.append(h('div', { class: 'scroll' }, table));
  return sec;
}

render(DATA && DATA.iterations ? DATA.iterations.length - 1 : 0);
</script>
